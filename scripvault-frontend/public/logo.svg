<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="svGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7F27" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#2D3748" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF7F27" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Vault Shield Icon Background -->
  <g transform="translate(10, 10)">
    <path d="M50 5 L90 20 V55 C90 80 50 95 50 95 C50 95 10 80 10 55 V20 Z" fill="url(#shieldGradient)" stroke="url(#svGradient)" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Vault Dial & Growth Bars -->
    <circle cx="50" cy="50" r="28" fill="none" stroke="#FF7F27" stroke-width="2.5" stroke-dasharray="6,3" />
    <path d="M32 62 L43 50 L54 56 L68 38" fill="none" stroke="url(#svGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="68,38 60,39 66,46" fill="#FF7F27" />
    <circle cx="50" cy="50" r="4" fill="#FF7F27" />
  </g>

  <!-- Brand Typography -->
  <text x="120" y="65" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="800" font-size="44" fill="#1A202C" letter-spacing="-0.5">
    Scrip<tspan fill="url(#svGradient)">Vault</tspan>
  </text>
  <text x="122" y="88" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="600" font-size="14" fill="#718096" letter-spacing="3">
    INVESTMENT PORTFOLIO
  </text>
</svg>
